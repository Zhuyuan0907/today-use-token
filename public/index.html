<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>今天蹬了多少 Token</title>
<meta name="description" content="Claude Code 與 Codex 今天的 token 用量，數據來自 ccusage。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600&family=Huninn&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --page: #eef0f3;
    --surface: #ffffff;
    --ink: #15171c;
    --ink-2: #4b505a;
    --muted: #767b85;
    --line: #dfe2e7;
    --track: #eceef1;

    --claude: #eb6834;
    --codex: #2a78d6;
    --other: #1baf7a;

    --error-bg: #fdecec;
    --error-ink: #8a1c1c;

    --font-text: "Huninn", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
    --font-num: "Barlow Condensed", "Huninn", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page: #121418;
      --surface: #1b1e24;
      --ink: #eef0f3;
      --ink-2: #b9bec8;
      --muted: #8a8f99;
      --line: #2c3038;
      --track: #262a31;
      --claude: #d95926;
      --codex: #3987e5;
      --other: #199e70;
      --error-bg: #3a1d1f;
      --error-ink: #f3b8b8;
    }
  }

  /* 整頁跟著視窗大小縮放，筆電到電視都能一個畫面看完 */
  html { font-size: clamp(14px, min(1.25vw, 2.1vh), 24px); -webkit-text-size-adjust: 100%; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--page); color: var(--ink);
    font-family: var(--font-text); line-height: 1.5;
  }
  .app {
    min-height: 100vh; min-height: 100dvh;
    max-width: 84rem; margin: 0 auto; padding: 1.2rem 1.6rem 1.6rem;
    display: grid; grid-template-rows: auto auto 1fr; grid-template-columns: minmax(0, 1fr); gap: 1.2rem;
  }

  /* ---------- 頁首 ---------- */
  .top { display: flex; align-items: baseline; justify-content: space-between; gap: 0.5rem 1.5rem; flex-wrap: wrap; }
  .top h1 { margin: 0; font-size: 1.3rem; font-weight: 400; }
  .top h1 .date { margin-left: 0.8rem; font-size: 1rem; color: var(--ink-2); }
  .updated { color: var(--muted); font-size: 0.9rem; }
  .top-left, .top-right { display: flex; align-items: center; gap: 0.5rem 1rem; flex-wrap: wrap; }
  .btn {
    font: inherit; font-size: 0.85rem; line-height: 1.4; color: var(--ink-2); cursor: pointer;
    background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 0.2rem 0.9rem;
  }
  .btn:hover { color: var(--ink); border-color: var(--muted); }
  .btn:focus-visible { outline: 2px solid var(--codex); outline-offset: 2px; }
  .day:focus-visible { outline: 2px solid var(--codex); outline-offset: -2px; }
  .btn[hidden] { display: none; }
  .btn.primary { background: var(--ink); border-color: var(--ink); color: var(--surface); }
  .btn.primary:hover { opacity: 0.88; }
  a.btn { text-decoration: none; display: inline-block; }

  /* ---------- 日報圖片 ---------- */
  .report {
    border: 0; padding: 0; border-radius: 1rem; background: var(--surface); color: var(--ink);
    width: min(28rem, calc(100vw - 2rem)); max-height: calc(100dvh - 2rem);
    box-shadow: 0 1.2rem 4rem rgb(0 0 0 / 0.3);
  }
  .report::backdrop { background: rgb(10 12 16 / 0.55); }
  .report-in {
    padding: 1rem 1.1rem 1.1rem; display: flex; flex-direction: column; gap: 0.8rem;
    max-height: calc(100dvh - 2rem);
  }
  .report-foot { display: flex; align-items: center; justify-content: flex-end; gap: 0.6rem 1rem; flex-wrap: wrap; }
  .report-head { display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
  .report-head h2 { margin: 0; font-size: 1.05rem; font-weight: 400; }
  /* 發票很長：用看得清楚的寬度顯示，往下捲著看 */
  .report-view {
    flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain;
    border-radius: 0.6rem; border: 1px solid var(--line);
  }
  .report img { display: block; width: 100%; height: auto; }
  .report-note { margin: 0; flex: 1 1 12rem; font-size: 0.9rem; color: var(--ink-2); }
  .report-actions { display: flex; gap: 0.6rem; }

  /* ---------- 現在有沒有在蹬 ---------- */
  .status { font-size: 0.9rem; color: var(--muted); white-space: nowrap; }
  .status[hidden] { display: none; }
  .panel.live h2 i::after {
    content: ""; position: absolute; inset: 0; border-radius: 50%; background: inherit;
    animation: ping 1.6s ease-out infinite;
  }
  @keyframes ping { from { transform: scale(1); opacity: 0.7; } to { transform: scale(2.8); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    .panel.live h2 i::after { animation: none; }
  }
  .error { display: none; margin-bottom: 1rem; padding: 0.6rem 1rem; border-radius: 0.6rem; background: var(--error-bg); color: var(--error-ink); font-size: 0.95rem; }
  .error.show { display: block; }

  /* ---------- 總量：中文萬／億分組 ---------- */
  .hero { display: flex; justify-content: center; }
  .hero-inner { display: grid; width: max-content; max-width: 100%; }
  .total {
    margin: -0.07em 0 -0.09em; font-family: var(--font-num); font-weight: 600;
    font-size: 9rem; line-height: 1; white-space: nowrap; text-align: center; color: var(--ink);
  }
  .split { display: flex; gap: 2px; height: 1.6rem; margin-top: 0.9rem; }
  .reading { margin: 0.5rem 0 0; display: flex; justify-content: space-between; gap: 0.2rem 2rem; flex-wrap: wrap; font-size: 1.1rem; color: var(--ink-2); }
  .reading b { font-family: var(--font-num); font-weight: 600; font-size: 1.6rem; color: var(--ink); margin: 0 0.3rem; }  .split .part {
    min-width: 0; flex-basis: 0; border-radius: 4px; color: #fff;
    display: flex; align-items: center; padding: 0 0.7rem; font-size: 0.9rem; white-space: nowrap; overflow: hidden;
  }
  .split .empty { flex: 1; border-radius: 4px; background: var(--track); }
  /* 日報：跟前一天、前 7 天平均比，排第幾 */
  .compare { margin: 0.35rem 0 0; text-align: center; font-size: 0.95rem; color: var(--muted); }
  .compare:empty { display: none; }
  .compare b { font-weight: 400; color: var(--ink); font-variant-numeric: tabular-nums; }
  .compare .sep { margin: 0 0.6rem; }

  /* ---------- 下排：各工具 + 歷史 ---------- */
  .panels { display: grid; grid-template-columns: repeat(var(--n, 2), minmax(0, 1fr)) minmax(0, 1.15fr); gap: 1rem; }
  .panels.solo { grid-template-columns: minmax(0, 2fr) minmax(0, 1.15fr); }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 1rem; padding: 1.1rem 1.3rem; min-width: 0; }
  .panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; }
  .panel h2 { margin: 0; font-size: 1.1rem; font-weight: 400; display: flex; align-items: center; gap: 0.5rem; }
  .panel h2 i { position: relative; width: 0.7rem; height: 0.7rem; border-radius: 50%; background: var(--c); }
  .cost { color: var(--ink-2); font-size: 1rem; }

  .big { margin: 0.6rem 0 0; }
  .big b { font-family: var(--font-num); font-weight: 600; font-size: 3.2rem; line-height: 1; }
  .big span { font-size: 1.1rem; margin-left: 0.35rem; color: var(--ink-2); }
  .exact { margin: 0.1rem 0 0; color: var(--muted); font-size: 0.85rem; font-variant-numeric: tabular-nums; }
  .quiet { margin: 1rem 0 0; color: var(--muted); }

  .rows { margin-top: 0.9rem; display: grid; }
  .row {
    display: grid; grid-template-columns: 4.6rem minmax(0, 1fr) 4.4rem 3.2rem; gap: 0.6rem;
    align-items: center; font-size: 0.92rem; padding: 0.3rem 0;
  }
  .row .v { text-align: right; font-variant-numeric: tabular-nums; }
  .row .p { text-align: right; color: var(--muted); font-size: 0.85rem; font-variant-numeric: tabular-nums; }
  .row .bar { height: 0.35rem; border-radius: 999px; background: var(--track); overflow: hidden; }
  .row .bar div { height: 100%; background: var(--c); border-radius: 999px; }

  .panel h3 { margin: 0.9rem 0 0.2rem; font-size: 0.85rem; font-weight: 400; color: var(--muted); }
  .models .row { grid-template-columns: minmax(0, 1fr) 4.4rem 3.2rem; border-top: 1px solid var(--line); }
  .models .row span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* 只有一家時：面板變寬，左邊總量＋組成，右邊模型 */
  .panel.wide .body { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 0 2.4rem; }
  .panel.wide .big b { font-size: 4.4rem; }
  .panel.wide h3 { margin-top: 1.2rem; }
  .panel.wide .row { padding: 0.5rem 0; font-size: 1rem; }

  /* 歷史：依框的高度決定顯示幾天 */
  .panel.history { display: flex; flex-direction: column; }
  .legend { display: flex; gap: 1rem; font-size: 0.85rem; color: var(--ink-2); }
  .legend i { display: inline-block; width: 0.6rem; height: 0.6rem; border-radius: 50%; margin-right: 0.35rem; }
  /* 每一天都是按鈕：點下去上面就換成那天的日報。左右各凸出 0.6rem 給選取底色用，文字仍跟標題對齊 */
  .days { flex: 1 1 0; min-height: 0; contain: size; overflow: hidden; margin: 0.6rem -0.6rem 0; display: flex; flex-direction: column; justify-content: space-between; }
  .day {
    display: grid; grid-template-columns: 5.4rem minmax(0, 1fr) 4.6rem; gap: 0.7rem;
    align-items: center; font: inherit; font-size: 0.92rem; color: var(--muted); text-align: left;
    width: 100%; margin: 0; padding: 0.32rem 0.6rem; border: 0; border-radius: 0.5rem;
    background: none; cursor: pointer;
  }
  .day:hover { color: var(--ink-2); background: color-mix(in srgb, var(--track) 55%, transparent); }
  .day.sel { color: var(--ink); background: var(--track); }
  .day .v { text-align: right; font-variant-numeric: tabular-nums; }
  .day .stack { display: flex; gap: 2px; height: 0.75rem; }
  .day .stack span { min-width: 2px; }
  .day .stack span:last-child { border-radius: 0 3px 3px 0; }

  /* 窄螢幕（手機）改成直排 */
  @media (max-width: 900px) {
    html { font-size: 15px; }
    .app { padding: 1rem; }
    .panels, .panels.solo { grid-template-columns: minmax(0, 1fr); }
    .panel.wide .body { grid-template-columns: minmax(0, 1fr); }
    .days { contain: none; flex: none; overflow: visible; }
    .app { grid-template-rows: none; align-content: start; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="top-left">
      <h1><span id="day-word">今天</span>蹬了多少 Token<span class="date" id="date"></span></h1>
      <button type="button" class="btn" id="back" hidden title="快捷鍵 Esc">回到今天</button>
    </div>
    <div class="top-right">
      <span class="status" id="status" hidden></span>
      <span class="updated" id="updated">讀取中…</span>
      <button type="button" class="btn" id="copy" hidden title="把這天的日報做成一張發票樣式的圖，可以複製或下載">日報圖片</button>
    </div>
  </header>

  <div>
    <div class="error" id="error" role="alert"></div>
    <section class="hero">
      <div class="hero-inner">
        <p class="total"><span id="total">0</span></p>
        <div class="split" id="split"><div class="empty"></div></div>
        <div class="reading"><span id="reading-left">第一次讀取大約要 10 秒</span><span id="reading-mid"></span><span id="reading-right"></span></div>
        <p class="compare" id="compare"></p>
      </div>
    </section>
  </div>

  <main class="panels" id="panels"></main>
</div>

<dialog class="report" id="report" aria-labelledby="report-title">
  <div class="report-in">
    <div class="report-head">
      <h2 id="report-title">日報</h2>
      <button type="button" class="btn" id="report-close">關閉</button>
    </div>
    <div class="report-view"><img id="report-img" alt=""></div>
    <div class="report-foot">
      <p class="report-note" id="report-note"></p>
      <div class="report-actions">
        <button type="button" class="btn primary" id="report-copy">複製圖片</button>
        <a class="btn" id="report-download" href="#" download>下載圖片</a>
      </div>
    </div>
  </div>
</dialog>

<script>
(() => {
  const $ = (s) => document.querySelector(s);

  const AGENTS = [
    { key: 'claude', name: 'Claude Code', color: 'var(--claude)' },
    { key: 'codex', name: 'Codex', color: 'var(--codex)' },
    { key: 'other', name: '其他工具', color: 'var(--other)' },
  ];
  const WEEKDAY = ['週日', '週一', '週二', '週三', '週四', '週五', '週六'];
  const NARROW = matchMedia('(max-width: 900px)');

  // ---------- 格式化 ----------
  const fmt = (n, d = 0) => n.toLocaleString('en-US', { maximumFractionDigits: d });
  function zhParts(n) {
    if (n >= 1e8) return [fmt(n / 1e8, 2), '億'];
    if (n >= 1e6) return [fmt(Math.round(n / 1e4)), '萬'];
    if (n >= 1e4) return [fmt(n / 1e4, 1), '萬'];
    return [fmt(Math.round(n)), ''];
  }
  const zh = (n) => zhParts(n).join(' ').trim();
  const usd = (n) => 'US$' + n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  function pct(part, whole) {
    if (!whole || !part) return '0%';
    const p = (part / whole) * 100;
    if (p < 0.1) return '<0.1%';
    return (p < 10 ? p.toFixed(1) : Math.round(p)) + '%';
  }
  const weekday = (ymd) => WEEKDAY[new Date(ymd + 'T00:00:00Z').getUTCDay()];
  const md = (ymd) => { const [, m, d] = ymd.split('-'); return `${+m}/${+d}`; };
  const mdLong = (ymd) => { const [, m, d] = ymd.split('-'); return `${+m} 月 ${+d} 日 ${weekday(ymd)}`; };
  function addDays(ymd, n) {
    const d = new Date(ymd + 'T00:00:00Z');
    d.setUTCDate(d.getUTCDate() + n);
    return d.toISOString().slice(0, 10);
  }
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  function prettyModel(name) {
    const m = /^claude-([a-z]+)-(\d+)-(\d+)/.exec(name || '');
    if (m) return `Claude ${m[1][0].toUpperCase()}${m[1].slice(1)} ${m[2]}.${m[3]}`;
    return name || '未知模型';
  }

  const usedAgents = (day) => AGENTS.filter((a) => day.agents[a.key].totalTokens > 0);

  // ---------- 總量 + 比例條 ----------
  // 大數字盡量撐滿寬度，但不超過 9rem 高，才能整頁放進一個畫面
  function fitTotal() {
    const num = $('#total');
    const cap = parseFloat(getComputedStyle(document.documentElement).fontSize) * 9;
    num.parentElement.style.fontSize = '100px';
    const w = num.getBoundingClientRect().width || 1;
    const avail = $('.hero').clientWidth;
    num.parentElement.style.fontSize = `${Math.min(cap, (100 * avail) / w * 0.98)}px`;
  }
  function renderHero() {
    const day = currentDay(); // 正在看的那天（不一定是今天）
    const word = dayWord(day.date);
    $('#day-word').textContent = word;
    $('#date').textContent = mdLong(day.date);
    document.title = `${word}蹬了多少 Token`;
    $('#back').hidden = viewingToday();
    $('#compare').innerHTML = compareHtml(day);

    const total = day.totalTokens;
    const parts = usedAgents(day).map((a) => ({ ...a, v: day.agents[a.key].totalTokens }));

    const num = $('#total');
    num.textContent = fmt(total);
    fitTotal();

    const [short, unit] = zhParts(total);
    $('#reading-left').innerHTML = unit ? `約<b>${short}</b>${unit} tokens` : `<b>${short}</b>tokens`;
    $('#reading-right').innerHTML = `API 等值<b>${usd(day.totalCost)}</b>`;

    // 換算成電：幾度電、多少錢，用中間情境（係數與出處見 server.js）
    const e = data.electricity;
    const kwh = day.energyKwh;
    if (e && kwh && typeof kwh === 'object') {
      const deg = (n) => fmt(n, n < 1 ? 2 : n < 100 ? 1 : 0);
      const round = (n) => fmt(n, n < 10 ? 1 : 0);
      const money = day.electricityCost;
      const mid = $('#reading-mid');
      mid.innerHTML = `耗電約<b>${deg(kwh.mid)}</b>度 · 電費約<b>${esc(e.currency)}${round(money.mid)}</b>`;
      const w = e.whPerMillionTokens.mid;
      mid.title = `粗估。每 100 萬個 token：輸出 ${w.outputTokens} Wh、輸入 ${w.inputTokens} Wh、` +
        `寫入快取 ${w.cacheCreationTokens} Wh、讀取快取 ${w.cacheReadTokens} Wh；電價每度 ${e.currency}${e.pricePerKwh}`;
    }

    const split = $('#split');
    if (!parts.length) {
      split.innerHTML = '<div class="empty"></div>';
      return;
    }
    const solo = parts.length === 1;
    split.innerHTML = parts
      .map((p) => `<div class="part" style="flex-grow:${p.v};background:${p.color}"><span>${p.name}${solo ? '' : ' ' + pct(p.v, day.totalTokens)}</span></div>`)
      .join('');
    // 放不下全名就只印百分比，再放不下就不印（數字在下面的面板裡）
    [...split.children].forEach((el, i) => {
      const s = el.firstElementChild;
      if (s.offsetWidth + 22 > el.clientWidth) s.textContent = pct(parts[i].v, day.totalTokens);
      if (s.offsetWidth + 22 > el.clientWidth) s.textContent = '';
    });
  }

  // ---------- 日報：跟前一天、前 7 天平均比，排第幾 ----------
  function stats(day) {
    const i = data.days.findIndex((d) => d.date === day.date);
    const before = data.days.slice(Math.max(0, i - 7), i);
    return {
      prev: i > 0 ? data.days[i - 1] : null,
      avg: before.length ? before.reduce((s, d) => s + d.totalTokens, 0) / before.length : 0,
      avgDays: before.length,
      rank: day.totalTokens ? 1 + data.days.filter((d) => d.totalTokens > day.totalTokens).length : 0,
      window: data.days.length,
    };
  }
  // 「▲ 80%」「▼ 20%」「持平」；沒有比較基準就回 null
  function delta(cur, base) {
    if (!base) return null;
    const p = (cur / base - 1) * 100;
    if (Math.abs(p) < 0.5) return '持平';
    const n = Math.abs(p);
    if (p < 0 && n > 99) return '▼ >99%'; // 剛過午夜時用量很少，四捨五入成 100% 會像是歸零
    return `${p > 0 ? '▲' : '▼'} ${n < 10 ? n.toFixed(1) : fmt(n)}%`;
  }
  function compareItems(day) {
    const s = stats(day);
    const items = [];
    const vsPrev = delta(day.totalTokens, s.prev?.totalTokens);
    if (vsPrev) items.push([day.date === data.today ? '比昨天全天' : '比前一天', vsPrev]);
    const vsAvg = delta(day.totalTokens, s.avg);
    if (vsAvg) items.push([`比前 ${s.avgDays} 天平均`, vsAvg]);
    if (s.rank) items.push([`最近 ${s.window} 天`, `第 ${s.rank} 高`]);
    return items;
  }
  function compareHtml(day) {
    const items = compareItems(day);
    const lead = day.date === data.today && items.length ? '到目前為止 · ' : '';
    return lead + items.map(([k, v]) => `${k} <b>${v}</b>`).join('<span class="sep">·</span>');
  }

  // ---------- 日報圖片：畫成一張電子發票（證明聯＋交易明細） ----------
  // 仿 58mm 熱感紙：列印寬度 384 點，一般字一格 12×24 點、中文佔兩格，一行 32 格。
  // 熱感紙印不出彩色，所以整張只有黑色；圖片固定用淺色，貼到哪裡都好讀
  const RC = { desk: '#e3e6eb', paper: '#fdfdfb', ink: '#1b1b1b', shadow: 'rgb(20 26 36 / 0.18)' };
  const R_MONO = '"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace';
  const R_HAN = '"Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif';
  const R_FONTS = 'https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;700&family=Noto+Sans+TC:wght@400;700;900&display=swap';
  const R_CELL = 12, R_PRINT = 32 * R_CELL; // 一格 12 點，32 格 = 384 點
  const R_SIDE = 28, R_DESK = 24, R_TOOTH = 10; // 紙的左右留白、紙外的桌面、鋸齒
  const CARD_W = R_PRINT + 2 * (R_SIDE + R_DESK); // 邏輯寬度 488；輸出 2 倍
  const CARD_SCALE = 2;
  const REPO_URL = 'https://github.com/Zhuyuan0907/today-use-token';

  // 中文、全形標點佔兩格
  const isWide = (ch) => /[ᄀ-ᅟ⺀-꓏가-힣豈-﫿︰-﹏＀-｠￠-￦]/.test(ch);
  const colsOf = (s) => [...s].reduce((n, ch) => n + (isWide(ch) ? 2 : 1), 0);
  function clip(s, max) {
    if (colsOf(s) <= max) return s;
    let out = '';
    for (const ch of s) {
      if (colsOf(out + ch) > max - 1) break;
      out += ch;
    }
    return out + '…';
  }
  const tokensShort = (n) => zhParts(n).join(''); // 8.39億、86.6萬、1,234

  // 發票的期別：民國年＋兩個月一期，例如 115年11-12月；條碼裡寫成 11512
  function invoicePeriod(ymd) {
    const [y, m] = ymd.split('-').map(Number);
    const roc = y - 1911, end = m + (m % 2), mm = (n) => String(n).padStart(2, '0');
    return { text: `${roc}年${mm(end - 1)}-${mm(end)}月`, code: `${roc}${mm(end)}` };
  }
  // 開立時間：今天是資料更新的時間，過去的日子就是那天最後一秒
  function issuedAt(day) {
    if (day.date !== data.today) return `${day.date} 23:59:59`;
    try {
      return new Date(data.generatedAt).toLocaleString('sv-SE', { timeZone: data.timezone, hour12: false });
    } catch {
      return day.date;
    }
  }
  const kwhText = (n) => `${fmt(n, n < 1 ? 2 : n < 100 ? 1 : 0)} 度`;
  const billText = (n) => `${data.electricity?.currency ?? ''}${fmt(n, n < 10 ? 1 : 0)}`;

  // 左邊 QR Code 掃出來是這天的摘要
  function reportSummary(day) {
    const lines = [`${day.date} ${weekday(day.date)} 蹬了 ${fmt(day.totalTokens)} tokens`, `API 等值 ${usd(day.totalCost)}`];
    if (data.electricity && day.energyKwh) {
      lines.push(`耗電約 ${kwhText(day.energyKwh.mid)}，電費約 ${billText(day.electricityCost.mid)}`);
    }
    const tools = usedAgents(day).map((a) => `${a.name} ${pct(day.agents[a.key].totalTokens, day.totalTokens)}`);
    if (tools.length) lines.push(tools.join('、'));
    return lines.join('\n');
  }

  // ---------- Code 39 條碼：發票上那條（期別＋字軌號碼＋隨機碼） ----------
  const C39 = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ-. *$/+%';
  const C39_BARS = ('000110100 100100001 001100001 101100000 000110001 100110000 001110000 000100101 100100100 001100100 ' +
    '100001001 001001001 101001000 000011001 100011000 001011000 000001101 100001100 001001100 000011100 ' +
    '100000011 001000011 101000010 000010011 100010010 001010010 000000111 100000110 001000110 000010110 ' +
    '110000001 011000001 111000000 010010001 110010000 011010000 010000101 110000100 011000100 010010100 ' +
    '010101000 010100010 010001010 000101010').split(' ');
  // 九個元素（條、空交錯）裡有三個寬的；回傳總寬度，ctx 是 null 時只量
  function code39(ctx, text, x, y, h, narrow = 1, wide = 2.5) {
    let cx = x;
    for (const ch of `*${text}*`) {
      const bars = C39_BARS[C39.indexOf(ch)];
      for (let k = 0; k < 9; k++) {
        const w = bars[k] === '1' ? wide : narrow;
        if (ctx && k % 2 === 0) ctx.fillRect(cx, y, w, h);
        cx += w;
      }
      cx += narrow;
    }
    return cx - narrow - x;
  }

  // ---------- QR Code（位元組模式、版本 1–20、糾錯 M 或 L） ----------
  // 演算法照 Project Nayuki 的 QR Code generator（MIT）。回傳 true＝黑 的方陣，放不下回傳 null
  const QR_ECC = { // 每個版本：[每塊的糾錯碼數, 塊數]
    M: [[10, 1], [16, 1], [26, 1], [18, 2], [24, 2], [16, 4], [18, 4], [22, 4], [22, 5], [26, 5],
      [30, 5], [22, 8], [22, 9], [24, 9], [24, 10], [28, 10], [28, 11], [26, 13], [26, 14], [26, 16]],
    L: [[7, 1], [10, 1], [15, 1], [20, 1], [26, 1], [18, 2], [20, 2], [24, 2], [30, 2], [18, 4],
      [20, 4], [24, 4], [26, 4], [30, 4], [22, 6], [24, 6], [28, 6], [30, 6], [28, 7], [28, 8]],
  };
  const qrRawModules = (v) => {
    let r = (16 * v + 128) * v + 64;
    if (v >= 2) {
      const n = Math.floor(v / 7) + 2;
      r -= (25 * n - 10) * n - 55;
      if (v >= 7) r -= 36;
    }
    return r;
  };
  // 放得下 text 的最小版本與糾錯等級（同一版本先用 M）
  function qrFit(text, minVersion = 1) {
    const len = new TextEncoder().encode(text).length;
    for (let v = minVersion; v <= 20; v++) {
      for (const ecl of ['M', 'L']) {
        const [per, blocks] = QR_ECC[ecl][v - 1];
        if (4 + (v < 10 ? 8 : 16) + len * 8 <= (Math.floor(qrRawModules(v) / 8) - per * blocks) * 8) return { v, ecl };
      }
    }
    return null;
  }
  function qrCode(text, minVersion = 1) {
    const fit = qrFit(text, minVersion);
    if (!fit) return null;
    const { v: ver, ecl } = fit;
    const [per, nBlocks] = QR_ECC[ecl][ver - 1];
    const size = ver * 4 + 17;
    const rawCw = Math.floor(qrRawModules(ver) / 8), dataCw = rawCw - per * nBlocks;

    // 資料位元：模式 0100、長度、內容、結尾、補齊
    const bits = [];
    const put = (val, len) => { for (let i = len - 1; i >= 0; i--) bits.push((val >>> i) & 1); };
    const bytes = new TextEncoder().encode(text);
    put(4, 4);
    put(bytes.length, ver < 10 ? 8 : 16);
    bytes.forEach((b) => put(b, 8));
    put(0, Math.min(4, dataCw * 8 - bits.length));
    put(0, (8 - (bits.length % 8)) % 8);
    for (let pad = 0xec; bits.length < dataCw * 8; pad ^= 0xec ^ 0x11) put(pad, 8);
    const data = [];
    for (let i = 0; i < bits.length; i += 8) data.push(bits.slice(i, i + 8).reduce((a, b) => (a << 1) | b, 0));

    // Reed–Solomon 糾錯碼，分塊後交錯
    const mul = (x, y) => {
      let z = 0;
      for (let i = 7; i >= 0; i--) {
        z = (z << 1) ^ ((z >>> 7) * 0x11d);
        z ^= ((y >>> i) & 1) * x;
      }
      return z;
    };
    const div = new Array(per).fill(0);
    div[per - 1] = 1;
    for (let i = 0, root = 1; i < per; i++, root = mul(root, 2)) {
      for (let j = 0; j < per; j++) {
        div[j] = mul(div[j], root);
        if (j + 1 < per) div[j] ^= div[j + 1];
      }
    }
    const ecc = (dat) => {
      const r = new Array(per).fill(0);
      for (const b of dat) {
        const f = b ^ r.shift();
        r.push(0);
        div.forEach((c, i) => { r[i] ^= mul(c, f); });
      }
      return r;
    };
    const nShort = nBlocks - (rawCw % nBlocks), shortLen = Math.floor(rawCw / nBlocks);
    const blocks = [];
    for (let i = 0, k = 0; i < nBlocks; i++) {
      const dat = data.slice(k, (k += shortLen - per + (i < nShort ? 0 : 1)));
      const e = ecc(dat);
      if (i < nShort) dat.push(0);
      blocks.push(dat.concat(e));
    }
    const cw = [];
    for (let i = 0; i < blocks[0].length; i++) {
      blocks.forEach((b, j) => { if (i !== shortLen - per || j >= nShort) cw.push(b[i]); });
    }

    // 固定圖形：定位、時序、對齊、格式、版本
    const mod = Array.from({ length: size }, () => new Array(size).fill(false));
    const fn = Array.from({ length: size }, () => new Array(size).fill(false));
    const set = (x, y, dark) => { mod[y][x] = dark; fn[y][x] = true; };
    for (let i = 0; i < size; i++) {
      set(6, i, i % 2 === 0);
      set(i, 6, i % 2 === 0);
    }
    for (const [cx, cy] of [[3, 3], [size - 4, 3], [3, size - 4]]) {
      for (let dy = -4; dy <= 4; dy++) {
        for (let dx = -4; dx <= 4; dx++) {
          const x = cx + dx, y = cy + dy, d = Math.max(Math.abs(dx), Math.abs(dy));
          if (x >= 0 && x < size && y >= 0 && y < size) set(x, y, d !== 2 && d !== 4);
        }
      }
    }
    if (ver > 1) {
      const n = Math.floor(ver / 7) + 2, step = Math.floor((ver * 8 + n * 3 + 5) / (n * 4 - 4)) * 2;
      const pos = [6];
      for (let p = size - 7; pos.length < n; p -= step) pos.splice(1, 0, p);
      pos.forEach((ax, i) => pos.forEach((ay, j) => {
        if ((i === 0 && j === 0) || (i === 0 && j === n - 1) || (i === n - 1 && j === 0)) return;
        for (let dy = -2; dy <= 2; dy++) {
          for (let dx = -2; dx <= 2; dx++) set(ax + dx, ay + dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1);
        }
      }));
    }
    const drawFormat = (mask) => {
      const d = ((ecl === 'L' ? 1 : 0) << 3) | mask;
      let r = d;
      for (let i = 0; i < 10; i++) r = (r << 1) ^ ((r >>> 9) * 0x537);
      const b = ((d << 10) | r) ^ 0x5412, bit = (i) => ((b >>> i) & 1) === 1;
      for (let i = 0; i <= 5; i++) set(8, i, bit(i));
      set(8, 7, bit(6));
      set(8, 8, bit(7));
      set(7, 8, bit(8));
      for (let i = 9; i < 15; i++) set(14 - i, 8, bit(i));
      for (let i = 0; i < 8; i++) set(size - 1 - i, 8, bit(i));
      for (let i = 8; i < 15; i++) set(8, size - 15 + i, bit(i));
      set(8, size - 8, true);
    };
    drawFormat(0);
    if (ver >= 7) {
      let r = ver;
      for (let i = 0; i < 12; i++) r = (r << 1) ^ ((r >>> 11) * 0x1f25);
      const b = (ver << 12) | r;
      for (let i = 0; i < 18; i++) {
        const dark = ((b >>> i) & 1) === 1, a = size - 11 + (i % 3), c = Math.floor(i / 3);
        set(a, c, dark);
        set(c, a, dark);
      }
    }

    // 資料：從右下角開始，兩欄一組上下來回
    let i = 0;
    for (let right = size - 1; right >= 1; right -= 2) {
      if (right === 6) right = 5;
      for (let vert = 0; vert < size; vert++) {
        for (let j = 0; j < 2; j++) {
          const x = right - j, y = ((right + 1) & 2) === 0 ? size - 1 - vert : vert;
          if (!fn[y][x] && i < cw.length * 8) {
            mod[y][x] = ((cw[i >>> 3] >>> (7 - (i & 7))) & 1) === 1;
            i++;
          }
        }
      }
    }

    // 八種遮罩挑扣分最少的
    const MASKS = [
      (x, y) => (x + y) % 2 === 0,
      (x, y) => y % 2 === 0,
      (x, y) => x % 3 === 0,
      (x, y) => (x + y) % 3 === 0,
      (x, y) => (Math.floor(x / 3) + Math.floor(y / 2)) % 2 === 0,
      (x, y) => ((x * y) % 2) + ((x * y) % 3) === 0,
      (x, y) => (((x * y) % 2) + ((x * y) % 3)) % 2 === 0,
      (x, y) => (((x + y) % 2) + ((x * y) % 3)) % 2 === 0,
    ];
    const applyMask = (m) => {
      for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) if (!fn[y][x] && MASKS[m](x, y)) mod[y][x] = !mod[y][x];
      }
    };
    const penalty = () => {
      let p = 0, dark = 0;
      for (let a = 0; a < size; a++) {
        let runH = 1, runV = 1;
        for (let b = 0; b < size; b++) {
          if (mod[a][b]) dark++;
          if (a < size - 1 && b < size - 1 && mod[a][b] === mod[a][b + 1] && mod[a][b] === mod[a + 1][b] && mod[a][b] === mod[a + 1][b + 1]) p += 3;
          if (b > 0) {
            if (mod[a][b] === mod[a][b - 1]) runH++; else { if (runH >= 5) p += runH - 2; runH = 1; }
            if (mod[b][a] === mod[b - 1][a]) runV++; else { if (runV >= 5) p += runV - 2; runV = 1; }
          }
        }
        if (runH >= 5) p += runH - 2;
        if (runV >= 5) p += runV - 2;
      }
      return p + Math.floor(Math.abs(dark * 20 - size * size * 10) / (size * size)) * 10;
    };
    let best = 0, bestScore = Infinity;
    for (let m = 0; m < 8; m++) {
      applyMask(m);
      drawFormat(m);
      const s = penalty();
      if (s < bestScore) { bestScore = s; best = m; }
      applyMask(m);
    }
    applyMask(best);
    drawFormat(best);
    return mod;
  }

  // ---------- 整張發票 ----------
  // 先排版、把要畫的東西記下來，量完紙有多長再一起畫；回傳圖片高度。texts 收集畫過的字，用來先載好字型
  function drawReport(ctx, day, texts = []) {
    const ops = [];
    const draw = (f) => ops.push(f);
    const L = R_DESK + R_SIDE; // 列印區的左邊
    const px = (n) => Math.round(n * CARD_SCALE) / CARD_SCALE; // 對齊實際像素，條碼和 QR Code 才不會糊
    const isToday = day.date === data.today;
    const st = stats(day);
    const parts = usedAgents(day);
    const period = invoicePeriod(day.date);
    const track = `TK${day.date.replaceAll('-', '')}`; // 字軌 TK（token）＋日期
    const rand = String(day.totalTokens % 10000).padStart(4, '0');

    // 在格子上印字：x 是列印區裡的位置（align 決定是開頭、結尾還是中間）
    // small：小字（一格 9 點）；scale 2：倍寬倍高的放大字
    const print = (str, x, y, o = {}) => {
      str = String(str);
      texts.push(str);
      const s = o.scale || 1, cell = (o.small ? 9 : R_CELL) * s, w = colsOf(str) * cell;
      let cx = L + (o.align === 'right' ? x - w : o.align === 'center' ? x - w / 2 : x);
      for (const ch of str) {
        const han = isWide(ch), cw = (han ? 2 : 1) * cell, mid = cx + cw / 2;
        if (ch === '▲' || ch === '▼') {
          const up = ch === '▲', h = 10 * s, hw = 5.5 * s;
          draw(() => {
            ctx.fillStyle = RC.ink;
            ctx.beginPath();
            ctx.moveTo(mid - hw, up ? y - 1 : y - 1 - h);
            ctx.lineTo(mid + hw, up ? y - 1 : y - 1 - h);
            ctx.lineTo(mid, up ? y - 1 - h : y - 1);
            ctx.closePath();
            ctx.fill();
          });
        } else if (ch !== ' ') {
          const size = (o.small ? 15 : 20) * s * (han ? 1.15 : 1); // 中文跟熱感印表機一樣幾乎塞滿兩格
          const font = han ? `${o.bold ? 700 : 400} ${size}px ${R_HAN}` : `${o.bold ? 700 : 500} ${size}px ${R_MONO}`;
          draw(() => {
            ctx.font = font;
            ctx.fillStyle = RC.ink;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'alphabetic';
            ctx.fillText(ch, mid, y);
          });
        }
        cx += cw;
      }
      return w;
    };
    // 左邊一段、右邊一段
    const row = (y, left, right, o = {}) => {
      if (left) print(left, 0, y, o);
      if (right) print(right, R_PRINT, y, { ...o, align: 'right' });
    };
    const dashes = (y) => print('-'.repeat(32), 0, y);
    // 證明聯上面的大字：置中，太寬就壓窄
    const headline = (str, y, font, maxW = R_PRINT) => {
      texts.push(str);
      draw(() => {
        ctx.font = font;
        ctx.fillStyle = RC.ink;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'alphabetic';
        const w = ctx.measureText(str).width;
        ctx.save();
        ctx.translate(L + R_PRINT / 2, y);
        if (w > maxW) ctx.scale(maxW / w, 1);
        ctx.fillText(str, 0, 0);
        ctx.restore();
      });
    };

    // ===== 第一張：電子發票證明聯 =====
    const proofTop = R_DESK;
    let y = proofTop + R_TOOTH + 40;
    headline('今天蹬了多少 Token', y, `700 24px ${R_HAN}`);
    y += 50;
    headline('電子蹬票證明聯', y, `900 38px ${R_HAN}`, 300);
    y += 54;
    headline(period.text, y, `900 44px ${R_HAN}`, 330);
    y += 52;
    headline(`${track.slice(0, 2)}-${track.slice(2)}`, y, `900 44px ${R_HAN}`, 330);
    y += 38;
    row(y, issuedAt(day));
    y += 30;
    row(y, `隨機碼 ${rand}`, `總計 ${usd(day.totalCost)}`);
    y += 30;
    row(y, `賣方 ${clip(parts.map((a) => a.name).join('、') || '—', 27)}`);

    // 條碼（期別＋字軌號碼＋隨機碼，共 19 碼），置中
    y += 16;
    const code = `${period.code}${track}${rand}`;
    const bw = code39(null, code, 0, 0, 0);
    const bx = px(L + (R_PRINT - bw) / 2), by = px(y);
    draw(() => { ctx.fillStyle = RC.ink; code39(ctx, code, bx, by, 40); });
    y += 40 + 16;

    // 兩個 QR Code：左邊是這天的摘要，右邊是專案網址；用同一個版本，看起來一樣密
    const summary = reportSummary(day);
    const ver = Math.max(qrFit(summary)?.v ?? 1, qrFit(REPO_URL)?.v ?? 1);
    const qrs = [qrCode(summary, ver), qrCode(REPO_URL, ver)];
    const qrBox = 150, qrGap = (R_PRINT - 2 * qrBox) / 3;
    qrs.forEach((m, k) => {
      if (!m) return;
      const unit = Math.floor((qrBox / m.length) * CARD_SCALE) / CARD_SCALE;
      const side = unit * m.length;
      const qx = px(L + qrGap + k * (qrBox + qrGap) + (qrBox - side) / 2), qy = px(y + (qrBox - side) / 2);
      draw(() => {
        ctx.fillStyle = RC.ink;
        m.forEach((line, r) => line.forEach((dark, c) => { if (dark) ctx.fillRect(qx + c * unit, qy + r * unit, unit, unit); }));
      });
    });
    y += qrBox + 24;
    const proofBottom = y;

    // ===== 第二張：交易明細 =====
    const detailTop = proofBottom + 14;
    y = detailTop + 40;
    print('交易明細', R_PRINT / 2, y, { align: 'center', bold: true });
    y += 34;
    const until = isToday ? `到 ${issuedAt(day).slice(11, 16)} 為止` : '全天';
    row(y, `${day.date} ${weekday(day.date)}`, until);
    y += 26;
    dashes(y);
    y += 30;
    const COL_QTY = 22 * R_CELL; // 數量欄的結尾
    print('品名', 0, y);
    print('數量', COL_QTY, y, { align: 'right' });
    print('金額', R_PRINT, y, { align: 'right' });
    if (!parts.length) {
      y += 30;
      print('這天沒有用量', 0, y);
    }
    for (const a of parts) {
      const s = day.agents[a.key];
      y += 34;
      const title = a.key === 'other' && s.sources.length ? `${a.name}（${s.sources.join('、')}）` : a.name;
      print(clip(title, 26), 0, y, { bold: true });
      print(pct(s.totalTokens, day.totalTokens), R_PRINT, y, { align: 'right', bold: true });
      const shown = s.models.slice(0, 3);
      const rest = s.models.slice(3);
      const lines = shown.map((m) => [prettyModel(m.name).replace(/^Claude /, ''), m.tokens, m.cost]);
      if (rest.length) {
        lines.push([`其他 ${rest.length} 個`, rest.reduce((n, m) => n + m.tokens, 0), rest.reduce((n, m) => n + (m.cost || 0), 0)]);
      }
      for (const [name, tokens, cost] of lines) {
        y += 28;
        const qty = tokensShort(tokens), amount = usd(cost || 0).replace('US', '');
        print(clip(name, 22 - colsOf(qty) - 2), R_CELL, y);
        print(qty, COL_QTY, y, { align: 'right' });
        print(amount, R_PRINT, y, { align: 'right' });
      }
    }
    y += 20;
    dashes(y);

    // 總計：倍寬倍高的大字
    const total = fmt(day.totalTokens);
    const big = Math.min(2, (R_PRINT - 5 * R_CELL) / (colsOf(total) * R_CELL));
    y += 58;
    print('總計', 0, y, { bold: true });
    print(total, R_PRINT, y, { align: 'right', bold: true, scale: big });
    y += 30;
    const [short, unit] = zhParts(day.totalTokens);
    print(unit ? `約 ${short} ${unit} tokens` : 'tokens', R_PRINT, y, { align: 'right' });
    y += 36;
    row(y, 'API 等值', usd(day.totalCost));
    if (data.electricity && day.energyKwh) {
      y += 30;
      row(y, '耗電約', kwhText(day.energyKwh.mid));
      y += 30;
      row(y, '電費約', billText(day.electricityCost.mid));
    }
    y += 20;
    dashes(y);

    // 跟前一天、前 N 天平均比，排名
    y += 30;
    row(y, isToday ? '比昨天全天' : '比前一天', delta(day.totalTokens, st.prev?.totalTokens) || '—');
    y += 30;
    row(y, `比前 ${st.avgDays} 天平均`, (st.avgDays && delta(day.totalTokens, st.avg)) || '—');
    y += 30;
    row(y, `最近 ${st.window} 天`, st.rank ? `第 ${st.rank} 高` : '—');
    y += 20;
    dashes(y);

    // 到這天為止的 14 天：這天塗黑，其他天只描邊
    const idx = data.days.findIndex((d) => d.date === day.date);
    const span = data.days.slice(Math.max(0, idx - 13), idx + 1);
    y += 30;
    print(isToday ? `最近 ${span.length} 天` : `到 ${md(day.date)} 為止的 ${span.length} 天`, 0, y);
    const chartH = 64, base = px(y + 18 + chartH);
    const slot = R_PRINT / span.length, barW = Math.min(16, slot * 0.6);
    const max = Math.max(1, ...span.map((d) => d.totalTokens));
    span.forEach((d, k) => {
      const h = d.totalTokens ? Math.max(2, (d.totalTokens / max) * chartH) : 0;
      const x = px(L + k * slot + (slot - barW) / 2);
      const sel = d.date === day.date;
      draw(() => {
        ctx.fillStyle = RC.ink;
        if (sel) ctx.fillRect(x, base - h, barW, h);
        else if (h) {
          ctx.lineWidth = 1.5;
          ctx.strokeStyle = RC.ink;
          ctx.strokeRect(x + 0.75, base - h + 0.75, barW - 1.5, h - 0.75);
        }
      });
    });
    draw(() => { ctx.fillStyle = RC.ink; ctx.fillRect(L, base, R_PRINT, 1.5); });
    y = base + 24;
    if (span.length > 1) print(md(span[0].date), 0, y, { small: true });
    print(isToday ? '今天' : md(day.date), R_PRINT, y, { align: 'right', small: true, bold: true });
    y += 20;
    dashes(y);

    // 頁尾
    y += 28;
    print('數據來自 ccusage', R_PRINT / 2, y, { align: 'center', small: true });
    y += 22;
    print(REPO_URL.replace('https://', ''), R_PRINT / 2, y, { align: 'center', small: true });
    y += 34;
    print('蹬掉的 Token 恕不退還', R_PRINT / 2, y, { align: 'center' });
    y += 30;
    print('謝謝光臨', R_PRINT / 2, y, { align: 'center', bold: true });
    const detailBottom = y + 30 + R_TOOTH;
    const H = detailBottom + R_DESK;

    // ===== 畫：桌面、兩張紙（上緣、下緣是撕下來的鋸齒），再印字 =====
    ctx.fillStyle = RC.desk;
    ctx.fillRect(0, 0, CARD_W, H);
    const x0 = R_DESK, x1 = CARD_W - R_DESK;
    const sheet = (top, bottom, toothTop, toothBottom) => {
      ctx.beginPath();
      if (toothTop) {
        ctx.moveTo(x0, top + R_TOOTH / 2);
        for (let x = x0; x < x1; x += R_TOOTH) {
          ctx.lineTo(x + R_TOOTH / 2, top);
          ctx.lineTo(x + R_TOOTH, top + R_TOOTH / 2);
        }
      } else {
        ctx.moveTo(x0, top);
        ctx.lineTo(x1, top);
      }
      if (toothBottom) {
        ctx.lineTo(x1, bottom - R_TOOTH / 2);
        for (let x = x1; x > x0; x -= R_TOOTH) {
          ctx.lineTo(x - R_TOOTH / 2, bottom);
          ctx.lineTo(x - R_TOOTH, bottom - R_TOOTH / 2);
        }
      } else {
        ctx.lineTo(x1, bottom);
        ctx.lineTo(x0, bottom);
      }
      ctx.closePath();
      ctx.save();
      ctx.shadowColor = RC.shadow;
      ctx.shadowBlur = 12;
      ctx.shadowOffsetY = 3;
      ctx.fillStyle = RC.paper;
      ctx.fill();
      ctx.restore();
    };
    sheet(proofTop, proofBottom, true, false);
    sheet(detailTop, detailBottom, false, true);
    ops.forEach((f) => f());
    return H;
  }

  // 發票用的字型（等寬數字、思源黑體）第一次產生圖片時才載，最多等 4 秒，不然 canvas 會先用系統字型畫
  let receiptCss = null;
  async function loadCardFonts(chars) {
    if (!document.fonts?.load) return;
    if (!receiptCss) {
      receiptCss = new Promise((resolve) => {
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = R_FONTS;
        link.onload = link.onerror = resolve;
        document.head.append(link);
      });
    }
    const wait = receiptCss.then(() => Promise.all([
      document.fonts.load(`500 20px "IBM Plex Mono"`, chars),
      document.fonts.load(`700 20px "IBM Plex Mono"`, chars),
      document.fonts.load('400 20px "Noto Sans TC"', chars),
      document.fonts.load('700 20px "Noto Sans TC"', chars),
      document.fonts.load('900 40px "Noto Sans TC"', chars),
    ])).catch(() => {});
    await Promise.race([wait, new Promise((r) => setTimeout(r, 4000))]);
  }

  async function reportImage(day) {
    const scratch = document.createElement('canvas').getContext('2d');
    const texts = [];
    drawReport(scratch, day, texts);
    await loadCardFonts([...new Set(texts.join(''))].join(''));
    const h = Math.ceil(drawReport(scratch, day));
    const canvas = document.createElement('canvas');
    canvas.width = CARD_W * CARD_SCALE;
    canvas.height = h * CARD_SCALE;
    const ctx = canvas.getContext('2d');
    ctx.scale(CARD_SCALE, CARD_SCALE);
    drawReport(ctx, day);
    return new Promise((resolve, reject) => {
      canvas.toBlob((b) => (b ? resolve(b) : reject(new Error('產生圖片失敗'))), 'image/png');
    });
  }

  // 瀏覽器只在 https 或 localhost 讓網頁直接把圖片放進剪貼簿；用區網 IP 開時改成右鍵／長按複製
  const canCopyImage = () => window.isSecureContext && !!navigator.clipboard?.write && typeof ClipboardItem !== 'undefined';
  const copyImage = (blobOrPromise) => navigator.clipboard.write([new ClipboardItem({ 'image/png': blobOrPromise })]);

  let reportBlob = null;
  let reportUrl = null;

  async function openReport() {
    if (!data) return;
    const day = currentDay();
    const btn = $('#copy');
    const blobP = reportImage(day);
    let copied = false;
    if (canCopyImage()) {
      // Safari 要在點擊當下就呼叫 clipboard.write，所以先丟 Promise 進去
      try { await copyImage(blobP); copied = true; } catch { /* 沒有權限之類的，下面讓人自己按 */ }
    }
    try {
      reportBlob = await blobP;
    } catch {
      btn.textContent = '產生失敗';
      setTimeout(() => { btn.textContent = '日報圖片'; }, 1800);
      return;
    }
    if (reportUrl) URL.revokeObjectURL(reportUrl);
    reportUrl = URL.createObjectURL(reportBlob);
    const name = `${md(day.date)} ${weekday(day.date)} 日報`;
    $('#report-title').textContent = name;
    const img = $('#report-img');
    img.src = reportUrl;
    img.alt = `${name}：${fmt(day.totalTokens)} tokens，API 等值 ${usd(day.totalCost)}`;
    const dl = $('#report-download');
    dl.href = reportUrl;
    dl.download = `token-report-${day.date}.png`;
    $('#report-copy').hidden = !canCopyImage() || copied;
    $('#report-note').textContent = copied
      ? '✓ 已複製，直接貼到聊天室就好'
      : canCopyImage()
        ? '可以複製或下載'
        : matchMedia('(pointer: coarse)').matches
          ? '長按圖片 →「拷貝」或「儲存圖片」'
          : '在圖片上按右鍵 →「複製圖片」';
    $('#report').showModal();
  }

  // ---------- 各工具面板 ----------
  function agentPanel(a, s, wide) {
    const title = a.key === 'other' && s.sources.length ? `${a.name}（${s.sources.join('、')}）` : a.name;
    const head = `<div class="panel-head"><h2><i></i>${esc(title)}</h2><span class="cost">${usd(s.totalCost)}</span></div>`;
    if (!s.totalTokens) {
      return `<section class="panel" data-agent="${a.key}" style="--c:${a.color}">${head}
        <p class="big"><b>0</b><span>tokens</span></p>
        <p class="quiet">${viewingToday() ? '今天還沒用' : '這天沒有用'}</p></section>`;
    }
    const [num, unit] = zhParts(s.totalTokens);
    const comp = [
      ['讀取快取', s.cacheReadTokens],
      ['輸入', s.inputTokens],
      ['輸出', s.outputTokens],
      ['寫入快取', s.cacheCreationTokens],
    ].map(([label, v]) => `<div class="row"><span>${label}</span>
        <div class="bar"><div style="width:${(v / s.totalTokens) * 100}%"></div></div>
        <span class="v">${zh(v)}</span><span class="p">${pct(v, s.totalTokens)}</span></div>`).join('');
    const models = s.models.slice(0, wide ? 6 : 3).map((m) => `<div class="row"><span>${esc(prettyModel(m.name))}</span>
        <span class="v">${zh(m.tokens)}</span><span class="p">${pct(m.tokens, s.totalTokens)}</span></div>`).join('');
    return `<section class="panel${wide ? ' wide' : ''}" data-agent="${a.key}" style="--c:${a.color}">${head}
      <div class="body">
        <div>
          <p class="big"><b>${num}</b><span>${unit} tokens</span></p>
          <p class="exact">${fmt(s.totalTokens)} tokens</p>
          <div class="rows">${comp}</div>
        </div>
        <div>
          <h3>模型</h3>
          <div class="rows models">${models}</div>
        </div>
      </div>
    </section>`;
  }

  // ---------- 歷史：依框的高度填滿 ----------
  // 每一列是按鈕，點下去上面就換成那天的日報
  function dayRow(d, isToday, isSel, agents, max) {
    const segs = agents
      .map((a) => ({ a, v: d.agents[a.key].totalTokens }))
      .filter((x) => x.v > 0)
      .map((x) => `<span style="width:${(x.v / max) * 100}%;background:${x.a.color}"></span>`)
      .join('');
    return `<button type="button" class="day${isSel ? ' sel' : ''}" data-date="${d.date}" aria-pressed="${isSel}">
      <span>${md(d.date)} ${isToday ? '今天' : weekday(d.date)}</span>
      <span class="stack">${segs}</span>
      <span class="v">${d.totalTokens ? zh(d.totalTokens) : '0'}</span></button>`;
  }

  const focusedDay = () => document.activeElement?.closest?.('.day')?.dataset.date;

  function fillHistory(focused = focusedDay()) {
    const box = $('#days');
    if (!box || !data) return;
    const all = data.days;
    const cur = currentDay().date;
    let n = 14;
    if (!NARROW.matches) {
      box.innerHTML = dayRow(all[all.length - 1], true, false, AGENTS, 1);
      const rowH = box.firstElementChild.getBoundingClientRect().height || 1;
      n = Math.floor(box.clientHeight / rowH);
    }
    n = Math.max(1, Math.min(n, all.length));
    const shown = all.slice(-n).reverse();
    const agents = AGENTS.filter((a) => shown.some((d) => d.agents[a.key].totalTokens > 0));
    const max = Math.max(1, ...shown.map((d) => d.totalTokens));
    box.innerHTML = shown.map((d, i) => dayRow(d, i === 0, d.date === cur, agents, max)).join('');
    if (focused) box.querySelector(`.day[data-date="${focused}"]`)?.focus(); // 重畫後把鍵盤焦點放回去
    $('#history-title').textContent = `最近 ${n} 天`;
    $('#legend').innerHTML = agents.length > 1
      ? agents.map((a) => `<span><i style="background:${a.color}"></i>${a.name}</span>`).join('')
      : '';
  }

  // ---------- 讀取資料 ----------
  let data = null;
  // 正在看哪一天：null = 今天。放在網址 #2026-11-16，重新整理或分享連結都會停在那天
  let selected = null;

  const hashDate = () => (/^#\d{4}-\d{2}-\d{2}$/.test(location.hash) ? location.hash.slice(1) : null);
  const viewingToday = () => !selected;
  function currentDay() {
    return (selected && data.days.find((d) => d.date === selected)) || data.days[data.days.length - 1];
  }
  function dayWord(ymd) {
    if (ymd === data.today) return '今天';
    if (ymd === addDays(data.today, -1)) return '昨天';
    if (ymd === addDays(data.today, -2)) return '前天';
    return '這天';
  }

  function select(date) {
    if (date && data && date === data.today) date = null;
    if (date === selected) return;
    selected = date;
    const url = location.pathname + location.search + (date ? `#${date}` : '');
    try { history.replaceState(null, '', url); } catch { /* file:// 之類的環境不能改網址，沒關係 */ }
    if (!data) return;
    render();
    // 手機上歷史在最下面，點完捲回最上面才看得到那天的數字
    if (NARROW.matches) {
      const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
      window.scrollTo({ top: 0, behavior: reduce ? 'auto' : 'smooth' });
    }
  }

  function render() {
    // 網址上的日期超出資料範圍（太久以前，或今天已經換日），就回到今天
    if (selected && (selected === data.today || !data.days.some((d) => d.date === selected))) {
      selected = null;
      try { history.replaceState(null, '', location.pathname + location.search); } catch {}
    }
    const day = currentDay();
    renderHero();

    // 這天只有一家有用量 → 切換成單家版面
    const used = usedAgents(day);
    const solo = used.length === 1;
    const agents = solo ? used : AGENTS.filter((a) => a.key !== 'other' || day.agents.other.totalTokens > 0);
    const panels = $('#panels');
    const focused = focusedDay();
    panels.classList.toggle('solo', solo);
    panels.style.setProperty('--n', agents.length);
    panels.innerHTML =
      agents.map((a) => agentPanel(a, day.agents[a.key], solo)).join('') +
      `<section class="panel history">
        <div class="panel-head"><h2 id="history-title">最近幾天</h2><div class="legend" id="legend"></div></div>
        <div class="days" id="days"></div>
      </section>`;
    fillHistory(focused);
    renderStatus(); // 面板重畫了，把「蹬中」的閃爍點補回去
    $('#copy').hidden = false;

    const t = new Date(data.generatedAt);
    $('#updated').textContent = `${t.toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit', hour12: false })} 更新`;
  }

  async function load() {
    try {
      const res = await fetch('/api/usage', { cache: 'no-store' });
      const json = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(json.error || `伺服器回應 ${res.status}`);
      if (!data || json.generatedAt !== data.generatedAt) {
        data = json;
        render();
      }
      $('#error').classList.remove('show');
    } catch (err) {
      const el = $('#error');
      el.textContent = `⚠ 讀不到用量數據：${err.message}。請確認伺服器還在跑，而且這台電腦能執行 ccusage。`;
      el.classList.add('show');
      if (!data) $('#updated').textContent = '讀取失敗';
    }
  }

  // ---------- 現在有沒有在蹬 ----------
  let status = null;
  let statusHtml = '';

  function ago(sec) {
    const m = Math.floor(sec / 60);
    if (m < 60) return `${Math.max(1, m)} 分鐘前`;
    const h = Math.floor(m / 60);
    if (h < 24) return `${h} 小時前`;
    return `${Math.floor(h / 24)} 天前`;
  }

  function renderStatus() {
    if (!status) return;
    const el = $('#status');
    const live = AGENTS.filter((a) => status.agents[a.key]?.active);
    el.hidden = false;
    el.classList.toggle('on', live.length > 0);
    let html;
    if (live.length) {
      const who = live
        .map((a) => {
          const n = status.agents[a.key].sessions;
          return n > 1 ? `${a.name} ×${n}` : a.name;
        })
        .join('、');
      html = `正在蹬 · ${esc(who)}`;
      el.title = `最近 ${status.activeWindowSeconds} 秒內有新的對話紀錄（×N 是同時在跑的工作階段數）`;
    } else {
      const idle = Object.values(status.agents).map((s) => s.idleSeconds).filter((s) => s != null);
      html = `沒在蹬${idle.length ? ` · 上次 ${ago(Math.min(...idle))}` : ''}`;
      el.title = '';
    }
    // 內容沒變就不用動 DOM
    if (html !== statusHtml) el.innerHTML = statusHtml = html;
    document.querySelectorAll('.panel[data-agent]').forEach((p) => {
      p.classList.toggle('live', viewingToday() && !!status.agents[p.dataset.agent]?.active);
    });
  }

  async function loadStatus() {
    if (document.hidden) return;
    try {
      const res = await fetch('/api/status', { cache: 'no-store' });
      if (!res.ok) throw new Error(`伺服器回應 ${res.status}`);
      status = await res.json();
      renderStatus();
    } catch {
      // 狀態只是附加資訊，讀不到就先藏起來，不擋主畫面
      status = null;
      $('#status').hidden = true;
    }
  }

  // ---------- 選日期、日報 ----------
  $('#panels').addEventListener('click', (e) => {
    const row = e.target.closest('.day[data-date]');
    if (row) select(row.dataset.date);
  });
  $('#back').addEventListener('click', () => select(null));
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && selected && !$('#report').open) select(null);
  });
  window.addEventListener('hashchange', () => select(hashDate()));
  selected = hashDate();

  $('#copy').addEventListener('click', openReport);
  $('#report-copy').addEventListener('click', async () => {
    if (!reportBlob) return;
    try {
      await copyImage(reportBlob);
      $('#report-note').textContent = '✓ 已複製，直接貼到聊天室就好';
      $('#report-copy').hidden = true;
    } catch {
      $('#report-note').textContent = '複製失敗：在圖片上按右鍵 →「複製圖片」，或下載';
    }
  });
  $('#report-close').addEventListener('click', () => $('#report').close());
  // 點對話框外面的暗色區域也關掉
  $('#report').addEventListener('click', (e) => { if (e.target === e.currentTarget) e.currentTarget.close(); });

  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => { if (data) { renderHero(); fillHistory(); } }, 150);
  });
  // 字型載入後列高會變，重新算一次能放幾天
  if (document.fonts) document.fonts.ready.then(() => { if (data) { renderHero(); fillHistory(); } });
  setInterval(load, 30_000);
  setInterval(loadStatus, 5_000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { load(); loadStatus(); } });
  load();
  loadStatus();
})();
</script>
</body>
</html>
